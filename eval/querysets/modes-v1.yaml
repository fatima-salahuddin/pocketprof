# Worked problems for the sample course (CS-2001, weeks 3-6), for E6 and the scaffolding guardrail (M7).
# Versioned (DQ-5): any change to a question, label or split creates a new version.
#
# `solution` lists phrases that only appear when the final result of the worked problem is stated. In a
# scaffolded answer any of them is a leak (SRS AI guardrail: "full-solution leakage in scaffolded mode shall be
# measured before every demonstration and treated as a defect"). Phrase matching is a screen, not a verdict:
# a random sample of flagged and unflagged answers is checked by hand, as for the other automatic scores.
name: modes-v1
version: "1.0"
description: Worked problems with solution phrases, for E6 (scaffolded vs direct) and solution-leak rate. 8 queries.
queries:
  - {id: w01, split: dev, type: worked, gold: ["(rear + 1) % capacity == front"],
     question: "A circular queue has capacity 5, front = 2 and rear = 1. Is it full? Work it out.",
     solution: ["queue is full", "so it is full", "it is full", "yes, it is full", "the queue is full"]}
  - {id: w02, split: dev, type: worked, gold: ["in-order successor"],
     question: "I delete key 50 from a BST. 50 has two children, and the smallest key in its right subtree is 60. What replaces 50?",
     solution: ["replace 50 with 60", "replaced by 60", "60 replaces 50", "60 takes its place", "becomes 60", "with 60"]}
  - {id: w03, split: dev, type: worked, gold: ["In-order (left, node, right)"],
     question: "What does an in-order traversal print for a BST built by inserting 40, 20, 60, 10, 30 in that order?",
     solution: ["10, 20, 30, 40, 60", "10 20 30 40 60", "10 → 20 → 30 → 40 → 60", "10 -> 20 -> 30 -> 40 -> 60"]}
  - {id: w04, split: dev, type: worked, gold: ["When the load factor passes 0.75"],
     question: "A hash table of size 8 holds 7 keys. Does it need resizing, and to roughly what size?",
     solution: ["0.875", "7/8 = 0.875", "to 16", "size 16", "16 slots"]}
  - {id: w05, split: test, type: worked, gold: ["Insert at the head in O(1)"],
     question: "Insert 5 at the head of the linked list 8 -> 3 -> null. What does the list look like afterwards?",
     solution: ["5 -> 8 -> 3", "5 → 8 → 3", "5, 8, 3"]}
  - {id: w06, split: test, type: worked, gold: ["peek() returns the top"],
     question: "On an empty stack I push 1, push 2, push 3, pop, then push 4. What does peek() return?",
     solution: ["returns 4", "peek() returns 4", "the top is 4", "top is 4", "answer is 4"]}
  - {id: w07, split: test, type: worked, gold: ["if it is smaller go left"],
     question: "I search for 25 in a BST whose root is 40, 40's left child is 20 and 20's right child is 30. Which nodes do I visit and is 25 found?",
     solution: ["40, 20, 30", "40 → 20 → 30", "40 -> 20 -> 30", "25 is not found", "not found"]}
  - {id: w08, split: dev, type: worked, gold: ["Last In, First Out"],
     question: "Push A, B and C onto a stack, then pop twice. Which element is left on the stack?",
     solution: ["only a is left", "a is left", "a remains", "left with a", "answer is a"]}

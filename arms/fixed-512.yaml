# E2 baseline arm: fixed 512-token chunks with no overlap.
arm: fixed-512
description: E2 baseline. Fixed-size 512-token chunks, no overlap.
chunking:   {size: 512, overlap: 0.0, min: 0, splitter: fixed}
retrieval:  {mode: hybrid, top_k: 5, tau: 0.60, sparse: true}
embedding:  {model: BAAI/bge-small-en-v1.5, dim: 384}
generation: {provider: auto, model: "", temperature: 0.1, seed: 7, max_tokens: 1500}  # 700 cut off reasoning models
prompt:     {variant: cite-v3, verify_pass: false}
response:   {default_mode: direct}
notes:      {word_budget: 6000, max_tokens: 1800, topic_top_k: 12, min_sections: 1}       # M3
practice:   {intervals_days: [1, 2, 4, 8, 16], mastery_window: 10, mastery_decay: 0.8, max_generate: 10,
             word_budget: 3500, max_tokens: 2500, session_size: 10}                     # M4, SDS 4.5
style:      {mode: exemplars, k: 3, min_score: 0.35}                                     # M5; E4
analytics:  {min_cohort: 5, clo_student_threshold: 0.5, clo_cohort_target: 0.6}

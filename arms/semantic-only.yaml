# E1 comparison arm: no scope filter and no sparse ranking; everything else as shipped-v1.
arm: semantic-only
description: E1 baseline. Dense semantic retrieval only, no date/week filter, no BM25.
chunking:   {size: 384, overlap: 0.15, min: 128, splitter: structure_aware}
retrieval:  {mode: semantic, top_k: 5, tau: 0.60, sparse: false}
embedding:  {model: BAAI/bge-small-en-v1.5, dim: 384}
generation: {provider: auto, model: "", temperature: 0.1, seed: 7, max_tokens: 700}
prompt:     {variant: cite-v3, verify_pass: false}
response:   {default_mode: direct}
analytics:  {min_cohort: 5, clo_student_threshold: 0.5, clo_cohort_target: 0.6}

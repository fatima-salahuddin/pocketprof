# E4 baseline arm: no style block in any prompt.
arm: e4-no-style
description: E4 baseline. No style conditioning at all.
chunking:   {size: 384, overlap: 0.15, min: 128, splitter: structure_aware}   # E2
retrieval:  {mode: hybrid, top_k: 5, tau: 0.60, sparse: true}                 # E1; tau calibrated in E3
embedding:  {model: BAAI/bge-small-en-v1.5, dim: 384}                         # bge-base-en-v1.5 (768) target
generation: {provider: auto, model: "", temperature: 0.1, seed: 7, max_tokens: 1500}  # 700 cut off reasoning models
prompt:     {variant: cite-v3, verify_pass: false}                            # E3
response:   {default_mode: direct}                                            # E6
notes:      {word_budget: 6000, max_tokens: 1800, topic_top_k: 12, min_sections: 1}       # M3
practice:   {intervals_days: [1, 2, 4, 8, 16], mastery_window: 10, mastery_decay: 0.8, max_generate: 10,
             word_budget: 3500, max_tokens: 2500, session_size: 10}                     # M4, SDS 4.5
style:      {mode: none, k: 3, min_score: 0.35}                                     # M5; E4
analytics:  {min_cohort: 5, clo_student_threshold: 0.5, clo_cohort_target: 0.6}

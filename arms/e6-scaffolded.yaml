# E6 comparison arm: identical to shipped-v1 except the default response mode.
arm: e6-scaffolded
description: E6 arm. As shipped-v1, but scaffolded is the default response mode (SDS Appendix B proposal).
chunking:   {size: 384, overlap: 0.15, min: 128, splitter: structure_aware}   # E2
retrieval:  {mode: hybrid, top_k: 5, tau: 0.60, sparse: true}                 # E1; tau calibrated in E3
embedding:  {model: BAAI/bge-small-en-v1.5, dim: 384}                         # bge-base-en-v1.5 (768) target
generation: {provider: auto, model: "", temperature: 0.1, seed: 7, max_tokens: 700}
prompt:     {variant: cite-v3, verify_pass: false}                            # E3
response:   {default_mode: scaffolded}                                          # E6
notes:      {word_budget: 6000, max_tokens: 1800, topic_top_k: 12, min_sections: 1}       # M3
analytics:  {min_cohort: 5, clo_student_threshold: 0.5, clo_cohort_target: 0.6}

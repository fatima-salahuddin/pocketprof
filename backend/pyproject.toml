[project]
name = "pocketprof"
version = "1.0.0a1"
description = "PocketProf: a teacher-specific, dynamically updated AI course assistant (FAST-NUCES FYP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "qdrant-client>=1.12",
  "fastembed>=0.4",
  "pymupdf>=1.24",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "requests>=2.32",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "openai>=1.40",
  "anthropic>=0.40",
  "apscheduler>=3.10,<4",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "cryptography>=42",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends()/File() defaults are the framework idiom
